[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mmisc"
version = "0.1.3"
readme = "README.md"
description = "Mickael's Miscellaneous Python Helpers and Utility Functions."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [
  { name="Mickael Temporão", email="16172142+mickaeltemporao@users.noreply.github.com" },
]
dependencies = [
  "statsmodels>=0.14.0",
  "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mickaeltemporao/mmisc"

[dependency-groups]
dev = [
    "twine>=6.2.0",
    "pytest>=8.0.0",
]
